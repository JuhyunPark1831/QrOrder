<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/manager/layouts/default}">

<th:block layout:fragment="script">
    <script th:src="@{/js/manager/common/infinitScroll.js}"></script>
    <script th:src="@{/js/manager/menu/manageMenu.js}"></script>
</th:block>

<div layout:fragment="content" class="container col-8 p-0 d-flex flex-column align-items-center bg-white">

    <div class="col-12 mt-3 d-flex justify-content-start">
        <button type="button" class="basic-tag-btn border-end" onclick="commonRedirect('/menu/create')">메뉴추가</button>
        <button type="button" class="basic-tag-btn active">메뉴관리</button>
    </div>

    <hr class="col-12 m-0 mb-3">

    <div class="col-11 py-3 ps-3 fs-4 fw-bold text-start border-bottom border-dark border-3">메뉴관리</div>

    <div class="col-6 my-4 d-flex justify-content-between align-items-center">
        <div class="col-12 ms-3 position-relative">
            <input type="text" id="search-word"
                   class="col-12 basic-search-bar border border-2 border-secondary"
                   placeholder="메뉴명으로 검색">
            <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3 fs-5 text-secondary"></i>
        </div>
    </div>

    <div id="menu-list" class="col-9">
        <div class="col-12 mb-3" th:each="category : ${categoryList}">
            <div class="ms-3 fs-5 fw-bold" th:text="${category.caName}"></div>

            <hr class="col-12 m-0 mb-3">

            <div class="col-12 d-flex flex-column align-items-center">
                <div class="basic-card col-10 mb-3 d-flex flex-column align-items-center"
                     th:each="menu : ${menuList}"
                     th:if="${menu.meCaId == category.caId}"
                     th:attr="data-id=${menu.meId}">
                    <div class="col-12 px-3 py-2 d-flex justify-content-between">
                        <div class="fs-5 fw-bold" th:text="${menu.meName}"></div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-primary px-2 py-1 modify-btn">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button type="button" class="btn btn-danger px-2 p-1 delete-btn">
                                <i class="bi bi-trash3-fill"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 px-3 pb-2 d-flex justify-content-between">
                        <div class="col-8 d-flex flex-column justify-content-between">
                            <div class="col-12 position-relative">
                                <div th:if="${menu.meStatus.toString() == 'AVAILABLE'}" class="col-3 p-0 rounded-pill bg-primary text-white text-center">판매중</div>
                                <div th:if="${menu.meStatus.toString() == 'HIDDEN'}" class="col-3 p-0 rounded-pill bg-secondary text-white text-center">숨김</div>
                                <div th:if="${menu.meStatus.toString() == 'TEMPORARILY_OUT'}" class="col-3 p-0 rounded-pill bg-success text-white text-center">임시품절</div>
                                <div th:if="${menu.meStatus.toString() == 'PERMANENTLY_OUT'}" class="col-3 p-0 rounded-pill bg-danger text-white text-center">품절</div>
                            </div>
                            <div class="col-12 my-2 text-start text-secondary"
                                 th:utext="${menu.meDescription}">
                            </div>
                            <div class="col-12 text-start fs-5 fw-normal" th:text="${#numbers.formatInteger(menu.mePrice, 1, 'COMMA')} + '원 ~ '"></div>
                        </div>
                        <div class="img-div sm-ver">
                            <img class="w-100 h-100 rounded border"
                                 th:if="${menu.meImagePath != null}"
                                 th:src="@{/api/image(imagePath=${menu.meImagePath})}"/>
                            <div class="w-100 h-100 rounded border bg-light"
                                 th:if="${menu.meImagePath == null}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
