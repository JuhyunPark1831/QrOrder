<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/manager/layouts/default}">

<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.0/themes/base/jquery-ui.css">
<th:block layout:fragment="script">
    <script th:src="@{/js/manager/category/manageCategory.js}"></script>
</th:block>

<div layout:fragment="content" class="container col-8 p-0 d-flex flex-column align-items-center bg-white">

    <div class="col-12 mt-3 d-flex justify-content-start">
        <button type="button" class="basic-tag-btn border-end active">카테고리 관리</button>
    </div>

    <hr class="col-12 m-0 mb-3">

    <div class="col-11 py-3 ps-3 fs-4 fw-bold text-start border-bottom border-dark border-3">카테고리 관리</div>

    <div class="col-6 my-4 d-flex justify-content-center align-items-center">
        <div class="col-12 ms-3 position-relative">
            <input type="text" id="search-word" class="col-12 basic-search-bar border border-2 border-secondary" placeholder="카테고리명으로 검색">
            <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3 fs-5 text-secondary"></i>
        </div>
    </div>

    <div class="bg-table col-9 mb-5 p-3 shadow-sm">
        <div class="col-12 mb-3 text-secondary text-center">* 카테고리명을 더블클릭하면 수정할 수 있습니다</div>
        <div id="category-list" class="col-12">
            <table class="col-12 mb-3">
                <thead>
                <tr class="border-bottom">
                    <th class="col-1 pb-2">
                        <input type="checkbox" />
                    </th>
                    <th class="col-3 pb-2">카테고리명</th>
                    <th class="col-2 pb-2">메뉴판 내 순서</th>
                    <th class="col-2 pb-2">메뉴 개수</th>
                </tr>
                </thead>
                <tbody class="border-bottom">
                <tr th:each="category : ${categoryList}" th:attr="data-id=${category.caId}">
                    <td class="py-1">
                        <input type="checkbox" class="category-check" />
                    </td>
                    <td class="py-1 d-flex justify-content-between">
                        <div class="category-name col-8 text-truncate" th:text="${category.caName}"></div>
                        <button type="button" class="changeAcName-btn d-none btn btn-primary p-0 px-2">수정</button>
                        <button type="button" class="changeAcName-cancel-btn d-none btn btn-secondary p-0 px-2 me-2">취소</button>
                    </td>
                    <td class="py-1" th:text="${category.caSeq} + '번째'"></td>
                    <td class="py-1" th:text="${category.caMenuCount} + '개'"></td>
                </tr>
                <tr id="create-row" class="d-none">
                    <td class="py-1 text-end cs-p">
                        <i id="close-create-btn" class="bi bi-x-circle me-2"></i>
                    </td>
                    <td class="py-1 d-flex justify-content-between">
                        <input id="caName" class="col-8 border-0" type="text" placeholder="카테고리명" />
                        <button type="button" id="create-btn" class="btn btn-primary p-0 px-2">
                            <i class="bi bi-floppy fs-5 py-1"></i>
                            저장
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${categoryList.totalElements == 0}" class="col-12 mt-3 text-center text-secondary">
                계정을 찾을 수 없습니다
            </div>
            <div th:if="${categoryList.totalElements != 0}" th:include="manager/fragments/pagination :: pagination(${currentPage}, ${totalPage})"></div>
        </div>
        <div class="col-12 d-flex justify-content-between gap-3">
            <button type="button" id="delete-btn" class="btn btn-danger px-2 pt-1 pb-0 mt-3">
                <i class="bi bi-trash3-fill"></i>
                삭제
            </button>
            <div>
                <button type="button" id="open-seq-pop-btn" class="btn btn-primary px-2 pt-1 pb-0 mt-3">
                    <i class="bi bi-arrow-right-square-fill"></i>
                    순서변경
                </button>
                <button type="button" id="open-create-btn" class="btn btn-primary px-2 pt-1 pb-0 mt-3">
                    <i class="bi bi-plus-circle"></i>
                    추가
                </button>
            </div>
        </div>
    </div>

    <!-- 카테고리 순서 팝업 -->
    <div class="d-none" id="seq-pop">
        <div class="basic-popup col-5 position-fixed top-50 start-50 translate-middle z-4">
            <div class="col-12 pe-2 pb-2 d-flex justify-content-between align-items-center">
                <div class="ms-3 mt-2 fs-4 fw-bold">카테고리 순서 변경</div>
                <svg id="close-seq-pop-btn" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                     class="bi bi-x-lg cs-p" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5">
                    <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
                </svg>
            </div>
            <div class="col-12 text-center text-secondary fs-6">메뉴판에서 보일 카테고리의 순서입니다</div>
            <div class="col-12 py-2 d-flex justify-content-center">
                <div class="col-2 d-flex flex-column align-items-center">
                    <div th:each="i : ${#numbers.sequence(1, categoryList.totalElements)}"
                         th:text="${i}" class="my-1 p-2 fs-5 shadow-sm bg-white">
                    </div>
                </div>
                <div id="category-order-list" class="col-9 d-flex flex-column align-items-center border border-2 rounded overflow-hidden">
                    <div class="col-12 my-1 p-2 d-flex fs-5 shadow-sm bg-white"
                         th:each="category : ${categoryList}"
                         th:attr="data-id=${category.caId}">
                        <i class="bi bi-arrows-vertical cs-p handle"></i>
                        <div class="ms-2" th:text="${category.caName}">메인메뉴</div>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-center gap-4">
                <button type="button" id="changeAcSeq-btn" class="btn btn-primary px-2 py-1 mb-3">
                    <i class="bi bi-floppy fs-5 py-1"></i>
                    저장
                </button>
            </div>
        </div>
        <div id="seq-pop-dark-area" class="w-100 h-100 position-fixed top-0 start-0 bg-black opacity-50 z-3"></div>
    </div>
</div>
</html>
